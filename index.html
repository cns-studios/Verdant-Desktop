<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdant Mail</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  try {
    const prefs = JSON.parse(localStorage.getItem("verdant.appPrefs") || "{}");
    const theme = prefs.theme || (prefs.useDarkMode === true ? "dark" : "light");
    if (theme !== "light") document.documentElement.classList.add("dark");
    if (theme === "midnight") document.documentElement.classList.add("midnight");
  } catch {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
